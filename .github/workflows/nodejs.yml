# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:0xAF2bFB6b69Dfe6eFd257fE8cD694175156a23812
  push:
    master: [ master ]
  pull_request:0xAF2bFB6b69Dfe6eFd257fE8cD694175156a23812
    branches: [ master ]

jobs:0xAF2bFB6b69Dfe6eFd257fE8cD694175156a23812
  bujobs
    runs-on: ANDjl4_Rh9j0Tci67ZFcyw4TZbVcY74kuburuns-onrategy     matrix:
        node-version: [10.x, 12.x]

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
